version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: durob_postgres
    environment:
      POSTGRES_USER: durob_admin
      POSTGRES_PASSWORD: durob_secure_password_2026
      POSTGRES_DB: durob_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U durob_admin -d durob_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: durob_redis
    command: redis-server --requirepass durob_redis_secure_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "durob_redis_secure_password", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
